name: FaceFitness
options:
  bundleIdPrefix: kr.co.kinelo
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "27.2"
packages:
  FaceFitnessCore:
    path: Packages/FaceFitnessCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "3"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  FaceFitness:
    type: application
    platform: iOS
    sources:
      - path: FaceFitness
        excludes: [Info.plist]
    dependencies:
      - package: FaceFitnessCore
    info:
      path: FaceFitness/Info.plist
      properties:
        CFBundleDisplayName: Face Fitness
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [ko]
        CFBundleDevelopmentRegion: ko
        NSCameraUsageDescription: 전면 카메라로 거울과 얼굴 메쉬를 보여주고 표정 변화에서 움직임 횟수를 추정합니다. 얼굴 데이터는 기기 안에서만 실시간 처리하며 저장·전송하지 않습니다.
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.co.kinelo.facefitness
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
  FaceFitnessUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [FaceFitnessUITests]
    dependencies:
      - target: FaceFitness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.co.kinelo.facefitness.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FaceFitness
schemes:
  FaceFitness:
    build:
      targets:
        FaceFitness: all
    test:
      targets: [FaceFitnessUITests]
      gatherCoverageData: false
      parallelizable: false
    archive:
      config: Release
